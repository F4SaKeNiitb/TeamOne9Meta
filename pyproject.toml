[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol_arena"
version = "0.1.0"
description = "PROTOCOL-ARENA: OpenEnv RL gym where agents learn to speak MCP and A2A under schema drift."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Manish Shaw"},
]

dependencies = [
    "openenv-core[core]>=0.2.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
train = ["trl>=0.8", "peft>=0.10", "accelerate>=0.27", "bitsandbytes>=0.43",
         "datasets>=2.18"]

[project.scripts]
arena-server = "arena.server.app:main"
arena-replay = "arena.server.replay:main"
arena-sft-bootstrap = "arena.training.sft_bootstrap:main"

[tool.setuptools.packages.find]
include = ["arena*"]
