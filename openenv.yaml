name: protocol_arena
version: "0.1.0"
description: >
  PROTOCOL-ARENA is an OpenEnv RL gym where an orchestrator LLM learns to
  speak real MCP and A2A protocol frames under mid-episode schema drift. A
  trained policy deploys directly into Claude Desktop, Cursor, mcp-cli, or
  any A2A-compliant client.

  Seven drift classes (additive, renaming, tightening, rate_limit,
  agentcard_churn, policy, auth) mirror documented failure modes in the
  MCP/A2A specs. The environment includes real MCP server stubs, A2A peer
  personas, a persistent capability knowledge graph beyond the context
  window, an adversarial safety layer (honeypot tools + prompt-injection
  defense), and a six-signal reward with full provenance plus a Brier
  calibration sentinel.

author: Manish Shaw
tags:
  - openenv
  - mcp
  - a2a
  - agent-protocols
  - schema-drift
  - long-horizon
  - multi-agent
  - world-modeling

tasks:
  - id: research_photo_basic
    difficulty: easy
    description: "Find the chemical equation of photosynthesis. No drift."
  - id: research_photo_rename
    difficulty: medium
    description: "Photosynthesis equation; search tool renamed mid-episode."
  - id: research_transformer_cite
    difficulty: medium
    description: "Identify transformer paper authors and year."
  - id: research_adam_additive
    difficulty: hard
    description: "Adam paper details; KB schema gains required field."
  - id: research_bell_tighten
    difficulty: hard
    description: "Bell's theorem year; query fields tightened."
  - id: research_k8s_rate
    difficulty: medium
    description: "Kubernetes scheduler role; rate limits tightened."
  - id: research_bh_churn
    difficulty: hard
    description: "Black hole event horizon; citer peer goes offline."
  - id: research_photo_auth
    difficulty: hard
    description: "C4 vs C3 plants; fetch_url gains auth scope."
  - id: research_gradient_multi
    difficulty: medium
    description: "Adam vs SGD explanation."
  - id: research_top_products
    difficulty: easy
    description: "Top 5 products by units via data warehouse."
  - id: consumer_policy_pii_search
    difficulty: medium
    description: "Search under PII-redaction policy drift."
  - id: consumer_rename_plus_policy
    difficulty: hard
    description: "Compound rename + policy drift."
  - id: consumer_churn_fallback
    difficulty: medium
    description: "Peer churn; fall back to alternative tools."

action_space:
  type: structured
  fields:
    - name: kind
      type: "enum[mcp, a2a, plan, memory, submit, rewind]"
    - name: rationale
      type: "string (min 20 chars)"
    - name: mcp_call
      type: "MCPCall (optional)"
    - name: a2a_call
      type: "A2ACall (optional)"
    - name: dag_delta
      type: "DAGDelta (optional)"
    - name: kg_op
      type: "KGOp (optional)"
    - name: final
      type: "string (optional, for submit)"
    - name: rewind_n
      type: "int 1..5 (optional, for rewind)"
    - name: confidence
      type: "float 0..1 (optional, used for Brier sentinel)"

observation_space:
  type: structured
  fields:
    - name: task_spec
      type: string
    - name: turn
      type: integer
    - name: budget
      type: BudgetBreakdown
    - name: last_result
      type: "ProtocolResult (optional)"
    - name: discovered
      type: "DiscoverySnapshot"
    - name: dag_state
      type: "DAGSnapshot"
    - name: memory_context
      type: "List[KGFact]"
    - name: otel_trace_id
      type: string
    - name: feedback
      type: string
    - name: reward_signals
      type: "Dict[str, float]"
    - name: reward
      type: "float"
    - name: done
      type: boolean

reward_function:
  signals:
    - name: task_correctness
      weight: 0.30
    - name: drift_robustness
      weight: 0.20
    - name: plan_quality
      weight: 0.20
    - name: protocol_hygiene
      weight: 0.15
    - name: efficiency
      weight: 0.10
    - name: memory_hit_bonus
      weight: 0.05
  penalties:
    - name: honeypot_triggered
      magnitude: 0.30
    - name: injection_followed
      magnitude: 0.40
  sentinels:
    - name: brier
      note: "calibration of `confidence` field — reported, NOT in reward"

endpoints:
  reset: POST /reset
  step: POST /step
  state: GET /state
